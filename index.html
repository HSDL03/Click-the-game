<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0c1a">
<meta name="description" content="Click the game">
<title>Click the game</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<style>
  :root{
    --bg:#0b0c1a;
    --panel-a:#181b38;
    --panel-b:#14162c;
    --text:#eef0ff;
    --muted:#8f95c4;
    --line:rgba(255,255,255,.07);
    --accent:#4f6dff;
    --accent2:#8b5bff;
    --gold:#ffcc66;
    --good:#33d17a;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;min-height:100vh;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--text);
    background:var(--bg);
    background-image:radial-gradient(900px 520px at 50% -10%,#2a2f6b 0%,transparent 65%);
    background-attachment:fixed;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;
    padding:24px 16px 100px;
    display:flex;justify-content:center;
    overflow-x:hidden;
  }
  input{-webkit-user-select:text;user-select:text}
  .wrap{width:100%;max-width:720px;position:relative;z-index:1}

  .bg-particles{
    position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  }
  .bg-particles i{
    position:absolute;display:block;border-radius:50%;
    background:radial-gradient(circle,rgba(91,140,255,.55),rgba(91,140,255,0) 70%);
    animation:floatUp linear infinite;
    opacity:.6;
  }
  @keyframes floatUp{
    0%{transform:translateY(105vh) scale(.6);opacity:0}
    12%{opacity:.55}
    88%{opacity:.55}
    100%{transform:translateY(-10vh) scale(1.1);opacity:0}
  }

  header{text-align:center;margin-bottom:18px}
  h1{font-size:clamp(22px,5vw,30px);margin:0;letter-spacing:.5px;font-weight:800;
    background:linear-gradient(180deg,#fff 30%,#8b9eff);
    -webkit-background-clip:text;background-clip:text;color:transparent;}

  .user-bar{
    display:flex;align-items:center;gap:10px;
    background:rgba(255,255,255,.04);
    border:1px solid var(--line);
    border-radius:14px;
    padding:10px 14px;
    margin-bottom:16px;
    font-size:14px;
    min-height:50px;
    flex-wrap:wrap;
  }
  .user-bar .uname{color:#9db4ff;font-weight:700}
  .user-bar .points{
    margin-left:auto;
    display:inline-flex;align-items:center;gap:5px;
    background:linear-gradient(135deg,rgba(255,204,102,.18),rgba(255,204,102,.06));
    border:1px solid rgba(255,204,102,.32);
    color:var(--gold);
    padding:5px 12px;border-radius:99px;
    font-weight:700;font-variant-numeric:tabular-nums;
    font-size:13px;
    transition:transform .18s ease, box-shadow .25s ease;
  }
  .user-bar .points.pulse{
    transform:scale(1.14);
    box-shadow:0 0 0 6px rgba(255,204,102,.12), 0 0 22px rgba(255,204,102,.5);
  }
  .btn.small{padding:8px 14px;font-size:13px;border-radius:10px}

  .panel{
    background:linear-gradient(180deg,var(--panel-a),var(--panel-b));
    border:1px solid var(--line);
    border-radius:20px;padding:16px;
    box-shadow:0 18px 40px -22px rgba(0,0,0,.9);
    margin-bottom:16px;
  }

  .hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
  .hud-item{
    background:rgba(255,255,255,.04);
    border-radius:12px;padding:11px 6px;text-align:center;
  }
  .hud-item .label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;letter-spacing:.5px}
  .hud-item .val{
    font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;
    display:inline-block;
  }
  .hud-item .val.bump{
    animation:bumpAnim .28s cubic-bezier(.3,1.6,.6,1);
  }
  @keyframes bumpAnim{
    0%{transform:scale(1)}
    40%{transform:scale(1.22);color:var(--gold)}
    100%{transform:scale(1)}
  }

  /* ===== 大按钮：仅缩放/位移动效 ===== */
  .click-btn{
    display:block;width:100%;
    height:clamp(220px,40vh,320px);
    border:0;border-radius:22px;
    background:linear-gradient(160deg,var(--accent),var(--accent2) 70%);
    color:#fff;font-family:inherit;
    font-size:clamp(28px,7vw,40px);font-weight:800;letter-spacing:8px;
    padding-left:8px;
    cursor:pointer;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;
    will-change:transform;
    transform:translateZ(0);
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    transition:
      transform .15s cubic-bezier(.2,.8,.3,1),
      box-shadow .2s ease,
      filter .15s ease;
    box-shadow:0 18px 36px -16px rgba(91,124,255,.85), inset 0 -4px 0 rgba(0,0,0,.22);
  }
  .click-btn:hover:not(:disabled){
    transform:translateZ(0) translateY(-3px);
    box-shadow:0 26px 46px -18px rgba(91,124,255,1), inset 0 -4px 0 rgba(0,0,0,.22);
  }
  .click-btn:active:not(:disabled){
    transform:translateZ(0) translateY(0) scale(.97);
    transition-duration:.06s;
    filter:brightness(.94);
    box-shadow:0 8px 16px -8px rgba(91,124,255,.6), inset 0 -1px 0 rgba(0,0,0,.22);
  }

  .status-bar{
    margin-top:12px;
    display:flex;align-items:center;
    font-size:13px;
  }
  .status-chip{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(255,255,255,.05);
    border:1px solid var(--line);
    padding:6px 12px;border-radius:99px;
    color:var(--muted);
    font-weight:600;
    transition:all .25s;
  }
  .status-chip.on{
    background:rgba(51,209,122,.12);
    border-color:rgba(51,209,122,.35);
    color:#7be2a8;
  }
  .status-chip .dot{
    width:7px;height:7px;border-radius:50%;
    background:currentColor;
  }
  .status-chip.on .dot{
    animation:blink 1.4s ease-in-out infinite;
  }
  @keyframes blink{
    0%,100%{opacity:1;transform:scale(1)}
    50%{opacity:.4;transform:scale(.7)}
  }

  .float-point{
    position:fixed;
    z-index:9999;
    color:var(--gold);
    font-weight:800;
    font-size:22px;
    pointer-events:none;
    text-shadow:0 2px 14px rgba(255,204,102,.9), 0 0 30px rgba(255,204,102,.4);
    animation:floatPoint 1.1s cubic-bezier(.15,.8,.3,1) forwards;
  }
  @keyframes floatPoint{
    0%{transform:translate(-50%,-50%) scale(.4);opacity:0}
    22%{transform:translate(-50%,-100%) scale(1.3);opacity:1}
    100%{transform:translate(-50%,-280%) scale(.9);opacity:0}
  }

  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;
    background:rgba(255,255,255,.08);color:#a8b0dd}
  .badge.cloud{background:rgba(51,209,122,.16);color:#5fe0a0}
  .badge.warn{background:rgba(255,150,60,.16);color:#ffb066}
  .badge.gold{background:rgba(255,204,102,.16);color:var(--gold)}

  .upgrade-item{
    position:relative;overflow:hidden;
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.06);
    border-radius:14px;
    padding:14px;
    transition:border-color .25s,background .25s;
  }
  .upgrade-item.is-max{
    background:linear-gradient(135deg,rgba(255,204,102,.1),rgba(255,204,102,.02));
    border-color:rgba(255,204,102,.32);
  }
  .upgrade-item.can-buy{
    border-color:rgba(91,140,255,.38);
    background:linear-gradient(135deg,rgba(91,140,255,.11),rgba(91,140,255,.02));
  }
  .upgrade-item.flash::after{
    content:'';
    position:absolute;inset:0;
    background:radial-gradient(circle,rgba(255,204,102,.6),transparent 70%);
    animation:flash .8s ease-out forwards;
    pointer-events:none;
  }
  @keyframes flash{
    from{opacity:1;transform:scale(.4)}
    to{opacity:0;transform:scale(1.6)}
  }

  .upgrade-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
  .upgrade-icon{
    font-size:22px;line-height:1;flex:none;
    width:42px;height:42px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.32);border-radius:12px;
    transition:transform .3s cubic-bezier(.3,1.6,.6,1);
  }
  .upgrade-item.flash .upgrade-icon{
    transform:scale(1.25) rotate(-8deg);
  }
  .upgrade-info{flex:1;min-width:0}
  .upgrade-info h4{margin:0 0 3px;font-size:15px;font-weight:700}
  .upgrade-info p{margin:0;font-size:12px;color:var(--muted);line-height:1.4}
  .upgrade-effect{
    display:block;font-size:12px;color:#9db4ff;margin-top:5px;font-weight:600;
  }

  .upgrade-lv{display:flex;gap:4px;flex:none;margin-top:6px}
  .upgrade-lv i{
    display:block;width:8px;height:8px;border-radius:50%;
    background:rgba(255,255,255,.14);
    transition:background .3s,box-shadow .3s;
  }
  .upgrade-lv i.on{
    background:var(--gold);
    box-shadow:0 0 8px rgba(255,204,102,.6);
    animation:dotPop .4s cubic-bezier(.3,1.8,.6,1);
  }
  @keyframes dotPop{
    0%{transform:scale(.3)}
    60%{transform:scale(1.5)}
    100%{transform:scale(1)}
  }

  .upgrade-foot{display:flex;align-items:center;gap:8px}
  .upgrade-price{
    display:inline-flex;align-items:center;gap:4px;
    font-size:14px;font-weight:700;color:var(--gold);
    font-variant-numeric:tabular-nums;
  }
  .upgrade-price.poor{color:#ff7a7a}
  .upgrade-foot .btn{margin-left:auto;padding:9px 18px;font-size:14px}

  .btn{
    border:0;border-radius:12px;padding:11px 16px;
    font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;
    transition:transform .12s,filter .15s,background .15s,box-shadow .2s;
  }
  .btn:active{transform:scale(.98)}
  .btn.primary{background:linear-gradient(160deg,var(--accent),var(--accent2));color:#fff}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.ghost{background:rgba(255,255,255,.07);color:var(--text)}
  .btn.ghost:hover{background:rgba(255,255,255,.11)}
  .btn.gold{background:linear-gradient(160deg,#ffb84d,#ff8a3d);color:#2a1700}
  .btn:disabled{opacity:.55;cursor:default;transform:none;filter:none}

  /* ===== 排行榜浮动按钮 ===== */
  .lb-fab{
    position:fixed;
    right:20px;bottom:20px;
    width:60px;height:60px;
    border-radius:50%;
    border:0;
    background:linear-gradient(160deg,var(--accent),var(--accent2));
    color:#fff;
    font-size:26px;line-height:1;
    cursor:pointer;
    z-index:200;
    display:flex;align-items:center;justify-content:center;
    -webkit-tap-highlight-color:transparent;
    will-change:transform;
    transform:translateZ(0);
    transition:transform .2s cubic-bezier(.2,.8,.3,1), box-shadow .2s ease;
    box-shadow:0 12px 28px -8px rgba(91,140,255,.7), inset 0 -3px 0 rgba(0,0,0,.2);
  }
  .lb-fab:hover{
    transform:translateZ(0) translateY(-4px);
    box-shadow:0 20px 36px -10px rgba(91,140,255,.9), inset 0 -3px 0 rgba(0,0,0,.2);
  }
  .lb-fab:active{
    transform:translateZ(0) scale(.92);
    transition-duration:.08s;
  }

  /* ===== 弹窗 ===== */
  .modal{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
  .modal.hidden{display:none}
  .modal-backdrop{position:absolute;inset:0;background:rgba(4,5,15,.82);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .modal-panel{
    position:relative;z-index:1;width:100%;max-width:380px;
    background:linear-gradient(180deg,#1c1f3d,#16182f);
    border:1px solid var(--line);border-radius:20px;padding:22px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.9);
    animation:modalIn .25s cubic-bezier(.15,.9,.3,1);
  }
  @keyframes modalIn{
    from{opacity:0;transform:translateY(20px) scale(.95)}
    to{opacity:1;transform:none}
  }
  .modal-close{position:absolute;top:8px;right:8px;background:transparent;border:0;color:var(--muted);
    font-size:24px;width:34px;height:34px;cursor:pointer;border-radius:9px;line-height:1;font-family:inherit}
  .modal-close:hover{background:rgba(255,255,255,.06);color:#fff}
  .modal-close.hidden{display:none}
  .modal-title{font-size:17px;font-weight:700;margin:0 0 14px;text-align:center}
  .modal-subtitle{text-align:center;font-size:12.5px;color:var(--muted);margin:0 0 14px;line-height:1.5}

  .tabs{display:flex;gap:5px;margin-bottom:16px;background:rgba(0,0,0,.28);padding:4px;border-radius:12px}
  .tab{flex:1;padding:9px;border:0;border-radius:9px;background:transparent;color:var(--muted);
    font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:all .18s}
  .tab.active{background:linear-gradient(160deg,var(--accent),var(--accent2));color:#fff}

  #authForm label{display:block;margin-bottom:12px}
  #authForm label > span{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
  #authForm input{
    width:100%;background:rgba(0,0,0,.35);
    border:1px solid rgba(255,255,255,.12);border-radius:11px;
    padding:11px 12px;color:var(--text);font-size:15px;font-family:inherit;outline:none;
    transition:border-color .15s,box-shadow .15s;
  }
  #authForm input::placeholder{color:#5e6390}
  #authForm input:focus{border-color:#5b8cff;box-shadow:0 0 0 3px rgba(91,140,255,.18)}
  #authSubmit{width:100%;margin-top:2px}

  .auth-error{background:rgba(255,90,90,.12);border:1px solid rgba(255,90,90,.35);
    color:#ff9a9a;border-radius:10px;padding:9px 11px;font-size:13px;margin-bottom:11px;word-break:break-word}
  .auth-error.hidden{display:none}
  .auth-info{background:rgba(51,209,122,.12);border:1px solid rgba(51,209,122,.35);
    color:#7be2a8;border-radius:10px;padding:9px 11px;font-size:13px;margin-bottom:11px}
  .auth-info.hidden{display:none}
  .auth-tip{margin:12px 0 0;font-size:12px;color:#6d739e;text-align:center;line-height:1.6}

  /* ===== 排行榜列表 ===== */
  .lb-list{
    display:flex;flex-direction:column;gap:6px;
    max-height:60vh;overflow-y:auto;
    padding-right:4px;
    scrollbar-width:thin;
    scrollbar-color:rgba(255,255,255,.15) transparent;
  }
  .lb-list::-webkit-scrollbar{width:5px}
  .lb-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:99px}

  .lb-row{
    display:flex;align-items:center;gap:8px;
    padding:9px 10px;border-radius:10px;
    background:rgba(255,255,255,.035);
    font-size:13.5px;
    animation:lbRowIn .35s ease backwards;
  }
  @keyframes lbRowIn{
    from{opacity:0;transform:translateX(-8px)}
    to{opacity:1;transform:none}
  }
  .lb-row.is-me{
    background:linear-gradient(135deg,rgba(91,140,255,.18),rgba(91,140,255,.06));
    box-shadow:inset 0 0 0 1px rgba(91,140,255,.45);
  }
  .lb-rank{width:24px;flex:none;text-align:center;font-weight:700;color:var(--muted);font-size:12px}
  .lb-rank.medal{font-size:17px}
  .lb-name{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lb-name em{font-style:normal;font-size:10px;font-weight:700;background:var(--accent);color:#fff;
    padding:1px 5px;border-radius:99px;margin-left:5px;vertical-align:middle}
  .lb-score{flex:none;font-weight:800;font-variant-numeric:tabular-nums;color:#9db4ff}

  .empty{color:#7b81ad;font-size:13px;text-align:center;padding:26px 8px}
</style>
</head>
<body>

<div class="bg-particles" id="bgParticles"></div>

<div class="wrap">
  <header>
    <h1>Click the game</h1>
  </header>

  <div class="user-bar">
    <span id="userText">加载中…</span>
    <span class="points" id="pointsBox" title="当前点数">💎 <span id="pointsVal">0</span></span>
    <button id="userAction" class="btn ghost small" type="button">退出</button>
  </div>

  <section class="panel">
    <div class="hud">
      <div class="hud-item">
        <span class="label">游玩时间</span>
        <span class="val" id="timer">00:00</span>
      </div>
      <div class="hud-item">
        <span class="label">累计点击</span>
        <span class="val" id="count">0</span>
      </div>
      <div class="hud-item">
        <span class="label">本次每秒</span>
        <span class="val" id="cps">0.0</span>
      </div>
    </div>

    <button id="clickBtn" class="click-btn" type="button">点击</button>

    <div class="status-bar">
      <span class="status-chip" id="syncChip">
        <span class="dot"></span>
        <span id="syncChipText">等待登录…</span>
      </span>
    </div>
  </section>

  <section class="panel">
    <h2 style="font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px;">
      ⚡ 升级 <span class="badge gold" id="upgradeBadge" style="margin-left:auto;">0 / 5</span>
    </h2>
    <div id="upgradeList"></div>
  </section>
</div>

<!-- 排行榜浮动按钮 -->
<button id="lbFab" class="lb-fab" type="button" title="排行榜" aria-label="排行榜">🏆</button>

<!-- 排行榜弹窗 -->
<div id="lbModal" class="modal hidden">
  <div class="modal-backdrop" data-close-lb></div>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="lbTitle">
    <button class="modal-close" type="button" data-close-lb aria-label="关闭">×</button>
    <h3 class="modal-title" id="lbTitle">🏆 排行榜</h3>
    <div id="leaderboard" class="lb-list"><div class="empty">加载中…</div></div>
  </div>
</div>

<!-- 登录弹窗 -->
<div id="authModal" class="modal hidden">
  <div class="modal-backdrop" data-close></div>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" type="button" data-close aria-label="关闭">×</button>
    <h3 class="modal-title" id="modalTitle">登录</h3>
    <p class="modal-subtitle" id="modalSubtitle">必须先登录才能开始</p>

    <div class="tabs">
      <button class="tab active" type="button" data-tab="login">登录</button>
      <button class="tab" type="button" data-tab="register">注册</button>
    </div>

    <div id="authError" class="auth-error hidden"></div>
    <div id="authInfo" class="auth-info hidden"></div>

    <form id="authForm" novalidate>
      <label>
        <span>用户名</span>
        <input id="authUsername" type="text" autocomplete="username"
               placeholder="3-16 位字母、数字或下划线"
               minlength="3" maxlength="16" required>
      </label>
      <label>
        <span>密码</span>
        <input id="authPassword" type="password" autocomplete="current-password"
               placeholder="至少 6 位" minlength="6" maxlength="72" required>
      </label>
      <button type="submit" class="btn primary" id="authSubmit">登录</button>
    </form>

    <p class="auth-tip">注册仅需用户名 + 密码，无需邮箱<br>用户名不支持中文和空格</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    }
  } catch (e) {
    console.error('Supabase 初始化失败', e);
  }

  const $ = id => document.getElementById(id);
  const timerEl = $('timer'), countEl = $('count'), cpsEl = $('cps');
  const clickBtn = $('clickBtn');
  const syncChip = $('syncChip'), syncChipText = $('syncChipText');
  const pointsBox = $('pointsBox'), pointsVal = $('pointsVal');
  const upgradeList = $('upgradeList'), upgradeBadge = $('upgradeBadge');
  const lbEl = $('leaderboard'), lbFab = $('lbFab'), lbModal = $('lbModal');
  const userText = $('userText'), userAction = $('userAction');
  const authModal = $('authModal'), authForm = $('authForm');
  const authUsername = $('authUsername'), authPassword = $('authPassword');
  const authSubmit = $('authSubmit'), authError = $('authError'), authInfo = $('authInfo');
  const modalTitle = $('modalTitle'), modalSubtitle = $('modalSubtitle');
  const modalCloseBtn = authModal.querySelector('.modal-close');
  const tabBtns = authModal.querySelectorAll('.tab[data-tab]');
  const bgParticles = $('bgParticles');

  let currentUser = null;
  let currentProfile = null;

  let sessionStart = Date.now();
  let sessionClicks = 0;
  let pendingClicks = 0;

  let uiTimer = null;
  let syncTimer = null;
  let lbTimer = null;
  let autoClickTimer = null;

  let authMode = 'login';
  let submitting = false;
  let authForced = true;
  let lbData = [];
  let syncing = false;

  /* ================= 工具 ================= */
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => (
      { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]
    ));
  }

  function formatTime(ms) {
    const totalSec = Math.max(0, Math.floor(ms / 1000));
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    if (h > 0) return h + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
    return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }

  function usernameOf(u) {
    if (!u) return '';
    const meta = u.user_metadata || {};
    if (meta.username) return meta.username;
    if (u.email) return u.email.split('@')[0];
    return '玩家';
  }

  function usernameToEmail(name) {
    return name.trim().toLowerCase() + CONFIG.EMAIL_DOMAIN;
  }

  function validateUsername(name) {
    if (!/^[A-Za-z0-9_]{3,16}$/.test(name)) {
      return '用户名需为 3-16 位字母、数字或下划线';
    }
    return '';
  }

  function defaultUpgrades() {
    return { autoClick: 0 };
  }

  function currentAutoLevel() {
    if (!currentProfile || !currentProfile.upgrades) return 0;
    return Number(currentProfile.upgrades.autoClick) || 0;
  }

  function currentPoints() {
    if (!currentProfile) return 0;
    return Number(currentProfile.points) || 0;
  }

  /* ================= 背景粒子 ================= */
  function buildParticles() {
    const count = window.innerWidth < 600 ? 8 : 14;
    let html = '';
    for (let i = 0; i < count; i++) {
      const size = 2 + Math.random() * 4;
      const left = Math.random() * 100;
      const dur = 14 + Math.random() * 12;
      const delay = -Math.random() * dur;
      html += '<i style="'
        + 'width:' + size + 'px;height:' + size + 'px;'
        + 'left:' + left + '%;'
        + 'animation-duration:' + dur + 's;'
        + 'animation-delay:' + delay + 's;'
        + '"></i>';
    }
    bgParticles.innerHTML = html;
  }

  /* ================= 动效 ================= */
  function floatPoint() {
    const rect = clickBtn.getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'float-point';
    el.textContent = '+1 💎';
    el.style.left = (rect.left + rect.width / 2) + 'px';
    el.style.top = (rect.top + rect.height / 2) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1200);

    pointsBox.classList.add('pulse');
    setTimeout(() => pointsBox.classList.remove('pulse'), 250);
  }

  function bumpValue(el) {
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  }

  /* ================= Profile ================= */
  async function loadProfile() {
    if (!sb || !currentUser) return null;
    const { data, error } = await sb
      .from('profiles')
      .select('*')
      .eq('id', currentUser.id)
      .maybeSingle();
    if (error) { console.warn('加载 profile 失败', error); return null; }
    if (!data) return null;

    data.points = Number(data.points) || 0;
    data.total_clicks = Number(data.total_clicks) || 0;
    if (!data.upgrades || typeof data.upgrades !== 'object') {
      data.upgrades = defaultUpgrades();
    } else if (data.upgrades.autoClick === undefined) {
      data.upgrades.autoClick = 0;
    }
    return data;
  }

  async function ensureProfile() {
    if (!sb || !currentUser) return null;
    let p = await loadProfile();

    if (p) {
      if (!p.upgrades || p.upgrades.autoClick === undefined) {
        const cleaned = Object.assign({}, p.upgrades || {}, { autoClick: 0 });
        const { error } = await sb.from('profiles')
          .update({ upgrades: cleaned })
          .eq('id', currentUser.id);
        if (!error) p.upgrades = cleaned;
      }
      return p;
    }

    const { error } = await sb.from('profiles')
      .insert({ id: currentUser.id, points: 0, total_clicks: 0, upgrades: defaultUpgrades() });
    if (error) console.warn('创建 profile 失败', error);

    return await loadProfile();
  }

  function setProfile(p) {
    currentProfile = p;
    renderUserBar();
    renderUpgradeList();
  }

  function renderUserBar() {
    if (!sb) {
      userText.textContent = '云端不可用';
      userAction.disabled = true;
      pointsVal.textContent = '0';
      return;
    }
    if (currentUser) {
      userText.innerHTML = '👤 <span class="uname">' + escapeHtml(usernameOf(currentUser)) + '</span>';
      userAction.disabled = false;
      userAction.textContent = '退出';
      userAction.dataset.action = 'logout';
      pointsVal.textContent = currentPoints();
    } else {
      userText.textContent = '未登录';
      userAction.disabled = true;
      pointsVal.textContent = '0';
    }
  }

  /* ================= 同步 ================= */
  function setSyncChip(text, ok) {
    syncChipText.textContent = text;
    syncChip.classList.toggle('on', !!ok);
  }

  async function syncProgress(force) {
    if (syncing || !sb || !currentUser || !currentProfile) return;
    if (pendingClicks <= 0 && !force) return;

    syncing = true;
    const toSync = pendingClicks;
    pendingClicks = 0;

    setSyncChip('同步中…', false);

    try {
      const { data, error } = await sb.rpc('sync_progress', { p_clicks: toSync });
      if (error) throw error;

      const res = data || {};
      if (!res.ok) throw new Error(res.error || 'unknown');

      currentProfile.total_clicks = Number(res.total_clicks) || 0;
      currentProfile.points = Number(res.points) || 0;

      pointsVal.textContent = currentProfile.points;
      countEl.textContent = currentProfile.total_clicks;
      renderUpgradeList();

      setSyncChip('已同步', true);
    } catch (err) {
      console.warn('同步失败', err);
      pendingClicks += toSync;
      setSyncChip('同步失败，稍后重试', false);
    } finally {
      syncing = false;
    }
  }

  /* ================= 核心点击 ================= */
  function doClick(auto) {
    if (!currentUser || !currentProfile) return;

    const prev = currentProfile.total_clicks || 0;
    const next = prev + 1;

    currentProfile.total_clicks = next;
    sessionClicks++;
    pendingClicks++;

    countEl.textContent = next;
    bumpValue(countEl);

    const crossed = Math.floor(next / CONFIG.POINT_PER_CLICKS) >
                    Math.floor(prev / CONFIG.POINT_PER_CLICKS);

    if (crossed) {
      currentProfile.points = currentPoints() + 1;
      pointsVal.textContent = currentProfile.points;
      floatPoint();
      renderUpgradeList();
    }

    if (navigator.vibrate && !auto) {
      try { navigator.vibrate(5); } catch (err) {}
    }
  }

  /* ================= 自动点击 ================= */
  function startAutoClick() {
    stopAutoClick();
    const lv = currentAutoLevel();
    if (lv <= 0) return;

    autoClickTimer = setInterval(() => {
      if (!currentUser || !currentProfile) return;
      doClick(true);
    }, AUTO_INTERVALS[lv]);
  }

  function stopAutoClick() {
    if (autoClickTimer) { clearInterval(autoClickTimer); autoClickTimer = null; }
  }

  /* ================= HUD ================= */
  function updateHud() {
    const elapsed = Date.now() - sessionStart;
    timerEl.textContent = formatTime(elapsed);
    if (elapsed > 1000) {
      cpsEl.textContent = (sessionClicks / (elapsed / 1000)).toFixed(1);
    }
  }

  /* ================= 排行榜 ================= */
  async function fetchLeaderboard() {
    if (!sb) throw new Error('云端不可用');
    const { data, error } = await sb.rpc('get_leaderboard');
    if (error) throw error;
    return (data || []).map(r => ({
      user_id: r.user_id,
      name: r.name,
      score: Number(r.score) || 0
    }));
  }

  function renderLeaderboard(list) {
    lbData = list || [];

    if (!lbData.length) {
      lbEl.innerHTML = '<div class="empty">还没有记录</div>';
      return;
    }

    const medals = ['🥇','🥈','🥉'];
    const myId = currentUser ? currentUser.id : null;

    lbEl.innerHTML = lbData.map((it, i) => {
      const rank = i + 1;
      const mark = rank <= 3 ? medals[rank - 1] : rank;
      const isMe = myId && it.user_id === myId;

      return '<div class="lb-row' + (isMe ? ' is-me' : '') + '" style="animation-delay:' + (i * 30) + 'ms">'
        + '<span class="lb-rank' + (rank <= 3 ? ' medal' : '') + '">' + mark + '</span>'
        + '<span class="lb-name">' + escapeHtml(it.name) + (isMe ? '<em>我</em>' : '') + '</span>'
        + '<span class="lb-score">' + it.score + '</span>'
        + '</div>';
    }).join('');
  }

  async function refreshLeaderboard() {
    if (!sb) {
      renderLeaderboard([]);
      return;
    }
    try {
      const rows = await fetchLeaderboard();
      renderLeaderboard(rows);
    } catch (err) {
      console.warn('排行榜加载失败', err);
      lbEl.innerHTML = '<div class="empty">加载失败</div>';
    }
  }

  function openLbModal() {
    lbModal.classList.remove('hidden');
    refreshLeaderboard();
  }

  function closeLbModal() {
    lbModal.classList.add('hidden');
  }

  lbFab.addEventListener('click', openLbModal);

  lbModal.addEventListener('click', function (e) {
    if (e.target.closest('[data-close-lb]')) closeLbModal();
  });

  /* ================= 升级面板 ================= */
  function renderUpgradeList() {
    const pts = currentPoints();
    const level = currentAutoLevel();
    const max = AUTOCLICK.maxLevel;
    const isMax = level >= max;
    const cost = isMax ? 0 : autoclickCost(level);
    const canBuy = !isMax && pts >= cost;
    const poor = !isMax && pts < cost;

    upgradeBadge.textContent = level + ' / ' + max;

    const effectText = level === 0
      ? '尚未解锁'
      : '每 ' + (AUTO_INTERVALS[level] / 1000).toFixed(1) + ' 秒自动点击一次';

    const dots = Array.from({ length: max }, (_, i) =>
      '<i class="' + (i < level ? 'on' : '') + '"></i>'
    ).join('');

    let btnHtml;
    if (isMax) {
      btnHtml = '<button class="btn ghost" disabled>已满级</button>';
    } else if (canBuy) {
      btnHtml = '<button class="btn gold" data-buy="' + AUTOCLICK.key + '">升级</button>';
    } else {
      btnHtml = '<button class="btn ghost" disabled>点数不足</button>';
    }

    upgradeList.innerHTML =
      '<div class="upgrade-item' + (isMax ? ' is-max' : (canBuy ? ' can-buy' : '')) + '" data-key="' + AUTOCLICK.key + '">'
      + '<div class="upgrade-head">'
      +   '<div class="upgrade-icon">' + AUTOCLICK.icon + '</div>'
      +   '<div class="upgrade-info">'
      +     '<h4>' + escapeHtml(AUTOCLICK.name) + '</h4>'
      +     '<p>' + escapeHtml(AUTOCLICK.desc) + '</p>'
      +     '<span class="upgrade-effect">' + escapeHtml(effectText) + '</span>'
      +   '</div>'
      +   '<div class="upgrade-lv">' + dots + '</div>'
      + '</div>'
      + '<div class="upgrade-foot">'
      +   '<span class="upgrade-price' + (poor ? ' poor' : '') + '">'
      +     (isMax ? '—' : '💎 ' + cost)
      +   '</span>'
      +   btnHtml
      + '</div>'
      + '</div>';
  }

  async function purchaseUpgrade(key) {
    if (!sb || !currentUser || !currentProfile) {
      alert('请先登录');
      return;
    }
    if (key !== AUTOCLICK.key) return;

    const level = currentAutoLevel();
    if (level >= AUTOCLICK.maxLevel) {
      alert('已经满级啦');
      return;
    }

    const cost = autoclickCost(level);
    if (currentPoints() < cost) {
      alert('点数不足，需要 ' + cost + ' 点');
      return;
    }

    const item = upgradeList.querySelector('.upgrade-item[data-key="' + key + '"]');
    const btn = item && item.querySelector('[data-buy]');
    if (btn) { btn.disabled = true; btn.textContent = '购买中…'; }

    const { data, error } = await sb.rpc('purchase_upgrade', {
      p_key: key,
      p_cost: cost,
      p_max: AUTOCLICK.maxLevel
    });

    if (error) {
      console.warn('购买失败', error);
      alert('购买失败：' + (error.message || '请稍后重试'));
      renderUpgradeList();
      return;
    }

    const res = data || {};
    if (!res.ok) {
      const msgs = {
        insufficient: '点数不足',
        max_level: '已经满级啦',
        not_authenticated: '登录状态已失效，请重新登录',
        profile_not_found: '数据异常，请重新登录',
        invalid_key: '升级项不存在',
        invalid_param: '参数错误'
      };
      alert(msgs[res.error] || ('购买失败：' + res.error));
      renderUpgradeList();
      return;
    }

    const newUpg = Object.assign({}, currentProfile.upgrades || defaultUpgrades());
    newUpg[key] = Number(res.level) || (level + 1);

    setProfile({
      id: currentProfile.id,
      points: Number(res.points) || 0,
      total_clicks: currentProfile.total_clicks,
      upgrades: newUpg
    });

    const newItem = upgradeList.querySelector('.upgrade-item[data-key="' + key + '"]');
    if (newItem) {
      newItem.classList.add('flash');
      setTimeout(() => newItem.classList.remove('flash'), 850);
    }

    startAutoClick();
  }

  upgradeList.addEventListener('click', function (e) {
    const btn = e.target.closest('[data-buy]');
    if (!btn) return;
    purchaseUpgrade(btn.dataset.buy);
  });

  /* ================= 登录弹窗 ================= */
  function openAuthModal(mode, forced) {
    if (!sb) return;
    authForced = !!forced;
    setAuthMode(mode || 'login');
    authModal.classList.remove('hidden');
    hideAuthMessages();
    authUsername.value = '';
    authPassword.value = '';
    setTimeout(() => authUsername.focus(), 40);
  }

  function closeAuthModal() {
    if (authForced && !currentUser) return;
    authModal.classList.add('hidden');
    hideAuthMessages();
  }

  function setAuthMode(mode) {
    authMode = mode;
    tabBtns.forEach(btn => btn.classList.toggle('active', btn.dataset.tab === mode));
    modalTitle.textContent = mode === 'register' ? '注册新账号' : '登录';
    modalSubtitle.textContent = authForced ? '必须先登录' : '登录后继续';
    authSubmit.textContent = mode === 'register' ? '注册并登录' : '登录';
    authPassword.setAttribute('autocomplete', mode === 'register' ? 'new-password' : 'current-password');
    modalCloseBtn.classList.toggle('hidden', authForced);
    hideAuthMessages();
  }

  function showAuthError(msg) {
    authError.textContent = msg;
    authError.classList.remove('hidden');
    authInfo.classList.add('hidden');
  }
  function showAuthInfo(msg) {
    authInfo.textContent = msg;
    authInfo.classList.remove('hidden');
    authError.classList.add('hidden');
  }
  function hideAuthMessages() {
    authError.classList.add('hidden');
    authInfo.classList.add('hidden');
  }

  async function submitAuth(e) {
    e.preventDefault();
    if (submitting || !sb) return;
    hideAuthMessages();

    const username = authUsername.value.trim();
    const password = authPassword.value;

    const nameErr = validateUsername(username);
    if (nameErr) { showAuthError(nameErr); authUsername.focus(); return; }
    if (password.length < 6) { showAuthError('密码至少 6 位'); authPassword.focus(); return; }

    submitting = true;
    authSubmit.disabled = true;
    authSubmit.textContent = authMode === 'register' ? '注册中…' : '登录中…';

    try {
      if (authMode === 'register') {
        const { data, error } = await sb.auth.signUp({
          email: usernameToEmail(username),
          password,
          options: { data: { username } }
        });
        if (error) throw error;

        if (!data.session) {
          showAuthInfo('注册成功，但项目开启了邮箱确认，无法直接登录。请到 Supabase 后台关闭「Confirm email」。');
          submitting = false;
          authSubmit.disabled = false;
          authSubmit.textContent = '注册并登录';
          return;
        }
      } else {
        const { error } = await sb.auth.signInWithPassword({
          email: usernameToEmail(username),
          password
        });
        if (error) throw error;
      }
    } catch (err) {
      console.warn(err);
      showAuthError(translateAuthError(err));
      submitting = false;
      authSubmit.disabled = false;
      authSubmit.textContent = authMode === 'register' ? '注册并登录' : '登录';
    }
  }

  function translateAuthError(err) {
    const msg = (err && (err.message || err.error_description || err.msg)) || '操作失败';
    if (/already registered|already exists|User already/i.test(msg)) return '该用户名已被注册';
    if (/Invalid login credentials/i.test(msg)) return '用户名或密码错误';
    if (/Password should be at least/i.test(msg)) return '密码至少 6 位';
    if (/Email not confirmed/i.test(msg)) return '邮箱未确认，请到后台关闭「Confirm Email」';
    if (/Email signups are disabled|email_provider_disabled/i.test(msg)) return '项目已禁用邮箱注册';
    if (/signup.*disabled|signups.*disabled/i.test(msg)) return '项目已禁用注册';
    if (/rate limit|too many/i.test(msg)) return '操作太频繁，请稍后再试';
    return msg;
  }

  async function handleLogout() {
    if (!sb) return;
    await syncProgress(true);
    await sb.auth.signOut();
  }

  /* ================= 事件绑定 ================= */
  clickBtn.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (!currentUser) { openAuthModal('login', true); return; }
    if (!currentProfile) return;

    doClick(false);
  });

  document.addEventListener('keydown', function (e) {
    // Escape 关闭排行榜弹窗
    if (e.key === 'Escape') {
      if (!lbModal.classList.contains('hidden')) { closeLbModal(); return; }
      if (!authModal.classList.contains('hidden')) {
        if (authForced && !currentUser) return;
        closeAuthModal();
        return;
      }
    }

    if (e.code !== 'Space' && e.code !== 'Enter') return;
    if (e.repeat) return;
    if (!authModal.classList.contains('hidden')) return;
    if (!lbModal.classList.contains('hidden')) return;
    if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
    if (!currentUser || !currentProfile) return;

    e.preventDefault();
    doClick(false);
  });

  userAction.addEventListener('click', function () {
    if (userAction.dataset.action === 'logout') handleLogout();
  });

  authForm.addEventListener('submit', submitAuth);
  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => setAuthMode(btn.dataset.tab));
  });

  authModal.addEventListener('click', function (e) {
    if (!e.target.closest('[data-close]')) return;
    if (authForced && !currentUser) return;
    closeAuthModal();
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      syncProgress(true);
    } else {
      refreshLeaderboard();
    }
  });

  /* ================= 认证状态 ================= */
  async function onSignedIn(session) {
    currentUser = session.user;
    renderUserBar();

    let p = await ensureProfile();
    if (!p) {
      p = { id: currentUser.id, points: 0, total_clicks: 0, upgrades: defaultUpgrades() };
    }
    setProfile(p);

    countEl.textContent = currentProfile.total_clicks || 0;

    sessionStart = Date.now();
    sessionClicks = 0;

    closeAuthModal();

    if (uiTimer) clearInterval(uiTimer);
    uiTimer = setInterval(updateHud, 200);

    if (syncTimer) clearInterval(syncTimer);
    syncTimer = setInterval(() => syncProgress(false), CONFIG.SYNC_INTERVAL);

    if (lbTimer) clearInterval(lbTimer);
    lbTimer = setInterval(() => {
      if (!document.hidden) refreshLeaderboard();
    }, CONFIG.LB_REFRESH_MS);

    startAutoClick();
    refreshLeaderboard();
    renderUpgradeList();
  }

  function onSignedOut() {
    currentUser = null;
    currentProfile = null;
    sessionClicks = 0;
    pendingClicks = 0;

    if (uiTimer) { clearInterval(uiTimer); uiTimer = null; }
    if (syncTimer) { clearInterval(syncTimer); syncTimer = null; }
    if (lbTimer) { clearInterval(lbTimer); lbTimer = null; }
    stopAutoClick();

    countEl.textContent = '0';
    cpsEl.textContent = '0.0';
    timerEl.textContent = '00:00';
    setSyncChip('等待登录…', false);

    renderUserBar();
    renderUpgradeList();
    refreshLeaderboard();
    openAuthModal('login', true);
  }

  /* ================= 初始化 ================= */
  async function init() {
    buildParticles();
    renderUserBar();
    renderUpgradeList();
    setSyncChip('等待登录…', false);

    if (!sb) {
      userText.textContent = '云端不可用';
      return;
    }

    sb.auth.onAuthStateChange(function (event, session) {
      if (event === 'SIGNED_IN' || event === 'INITIAL_SESSION' || event === 'TOKEN_REFRESHED') {
        if (session) onSignedIn(session);
      }
      if (event === 'SIGNED_OUT') {
        onSignedOut();
      }
      submitting = false;
      authSubmit.disabled = false;
    });

    try {
      const { data } = await sb.auth.getSession();
      if (data && data.session) {
        await onSignedIn(data.session);
      } else {
        openAuthModal('login', true);
        refreshLeaderboard();
      }
    } catch (e) {
      console.warn(e);
      openAuthModal('login', true);
      refreshLeaderboard();
    }
  }

  init();
})();
</script>
</body>
</html>
