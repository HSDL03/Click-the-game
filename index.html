<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0c1a">
<meta name="description" content="无尽点击挑战小游戏，登录后可上传成绩和升级">
<title>⚡ 疯狂点击 · 无尽模式</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<style>
  :root{
    --bg:#0b0c1a;
    --panel-a:#181b38;
    --panel-b:#14162c;
    --text:#eef0ff;
    --muted:#8f95c4;
    --line:rgba(255,255,255,.07);
    --accent:#4f6dff;
    --accent2:#8b5bff;
    --gold:#ffcc66;
    --good:#33d17a;
    --danger:#ff7a7a;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;min-height:100vh;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--text);
    background:var(--bg);
    background-image:radial-gradient(900px 520px at 50% -10%,#2a2f6b 0%,transparent 65%);
    background-attachment:fixed;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;
    padding:20px 16px 44px;
    display:flex;justify-content:center;
  }
  input{-webkit-user-select:text;user-select:text}
  .wrap{width:100%;max-width:1040px}

  header{text-align:center;margin-bottom:14px}
  h1{font-size:clamp(22px,5vw,30px);margin:0 0 8px;letter-spacing:.5px}
  .sub{margin:0;color:var(--muted);font-size:14px}
  .sub b{color:#9db4ff}

  .user-bar{
    display:flex;align-items:center;gap:10px;
    background:rgba(255,255,255,.04);
    border:1px solid var(--line);
    border-radius:14px;
    padding:10px 14px;
    margin-bottom:16px;
    font-size:14px;
    min-height:50px;
    flex-wrap:wrap;
  }
  .user-bar .uname{color:#9db4ff;font-weight:700}
  .user-bar .points{
    margin-left:auto;
    display:inline-flex;align-items:center;gap:5px;
    background:linear-gradient(135deg,rgba(255,204,102,.18),rgba(255,204,102,.06));
    border:1px solid rgba(255,204,102,.32);
    color:var(--gold);
    padding:5px 12px;border-radius:99px;
    font-weight:700;font-variant-numeric:tabular-nums;
    font-size:13px;
  }
  .btn.small{padding:8px 14px;font-size:13px;border-radius:10px}

  .grid{display:grid;gap:16px;grid-template-columns:1fr}
  @media(min-width:900px){
    .grid{grid-template-columns:1.12fr .88fr;align-items:start}
    .left-col{display:flex;flex-direction:column;gap:16px}
  }

  .panel{
    background:linear-gradient(180deg,var(--panel-a),var(--panel-b));
    border:1px solid var(--line);
    border-radius:20px;padding:16px;
    box-shadow:0 18px 40px -22px rgba(0,0,0,.9);
  }

  .hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .hud-item{background:rgba(255,255,255,.04);border-radius:12px;padding:9px 6px;text-align:center}
  .hud-item .label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px;letter-spacing:.5px}
  .hud-item .val{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}

  /* ===== 大按钮：GPU 加速 ===== */
  .click-btn{
    display:block;width:100%;
    height:clamp(180px,32vh,270px);
    border:0;border-radius:22px;
    background:linear-gradient(160deg,var(--accent),var(--accent2) 70%);
    color:#fff;font-family:inherit;
    font-size:clamp(22px,5.5vw,32px);font-weight:800;letter-spacing:3px;
    cursor:pointer;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;
    will-change:transform;
    transform:translateZ(0) scale(1);
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    transition:
      transform .07s cubic-bezier(.2,.8,.3,1),
      background .2s ease,
      box-shadow .2s ease;
    box-shadow:0 16px 34px -14px rgba(91,124,255,.9),inset 0 -4px 0 rgba(0,0,0,.22);
  }
  .click-btn.is-playing{
    background:linear-gradient(160deg,#ff5b7f,#ff8a3d 70%);
    box-shadow:0 16px 34px -14px rgba(255,107,107,.9),inset 0 -4px 0 rgba(0,0,0,.22);
    letter-spacing:6px;
  }
  .click-btn:not(:disabled):active{
    transform:translateZ(0) scale(.955);
    transition-duration:.03s;
  }
  .click-btn:disabled{filter:grayscale(.55) brightness(.75);cursor:not-allowed;box-shadow:none}

  .auto-info{
    margin-top:10px;
    text-align:center;
    font-size:13px;font-weight:600;
    color:#7be2a8;
    background:rgba(51,209,122,.09);
    border:1px solid rgba(51,209,122,.28);
    border-radius:11px;
    padding:8px 12px;
    animation:fadeUp .25s ease;
  }
  .auto-info.hidden{display:none}

  .stop-row{margin-top:10px}
  .stop-row.hidden{display:none}

  .result{margin-top:14px;padding:16px;border-radius:16px;
    background:rgba(255,255,255,.04);border:1px solid var(--line);animation:fadeUp .25s ease}
  .result.hidden{display:none}
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .result-score{font-size:44px;font-weight:800;text-align:center;line-height:1;
    font-variant-numeric:tabular-nums;
    background:linear-gradient(180deg,#fff,#9db4ff);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .result-score small{font-size:16px;font-weight:600;margin-left:4px;color:var(--muted);-webkit-text-fill-color:var(--muted)}
  .result-msg{text-align:center;color:var(--muted);font-size:14px;margin:8px 0 6px}
  .result-reward{
    text-align:center;
    font-size:14px;font-weight:700;
    color:var(--gold);
    margin:0 0 14px;
  }
  .result-reward.hidden{display:none}

  .btn{
    border:0;border-radius:12px;padding:11px 16px;
    font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;
    transition:transform .06s,filter .15s,background .15s;
  }
  .btn:active{transform:scale(.98)}
  .btn.primary{background:linear-gradient(160deg,var(--accent),var(--accent2));color:#fff}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.ghost{background:rgba(255,255,255,.07);color:var(--text)}
  .btn.ghost:hover{background:rgba(255,255,255,.11)}
  .btn.gold{background:linear-gradient(160deg,#ffb84d,#ff8a3d);color:#2a1700}
  .btn.danger{background:rgba(255,90,90,.15);color:#ff9a9a;border:1px solid rgba(255,90,90,.35)}
  .btn.danger:hover{background:rgba(255,90,90,.25)}
  .btn.block{width:100%}
  .btn.tiny{padding:8px 12px;font-size:13px;border-radius:10px}
  .btn:disabled{opacity:.55;cursor:default;transform:none;filter:none}
  .stack{display:flex;flex-direction:column;gap:8px;margin-top:2px}

  .panel h2{font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .badge{margin-left:auto;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;
    background:rgba(255,255,255,.08);color:#a8b0dd}
  .badge.cloud{background:rgba(51,209,122,.16);color:#5fe0a0}
  .badge.warn{background:rgba(255,150,60,.16);color:#ffb066}

  /* ===== 排行榜折叠 ===== */
  .lb-wrap{display:flex;flex-direction:column;gap:6px}
  .lb-wrap.collapsed .lb-row.extra{display:none}
  .lb-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;
    background:rgba(255,255,255,.035);font-size:14px;transition:background .2s}
  .lb-row.is-me{background:rgba(91,140,255,.14);box-shadow:inset 0 0 0 1px rgba(91,140,255,.4)}
  .lb-rank{width:26px;flex:none;text-align:center;font-weight:700;color:var(--muted)}
  .lb-name{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lb-name em{font-style:normal;font-size:10px;font-weight:700;background:var(--accent);color:#fff;
    padding:1px 5px;border-radius:99px;margin-left:6px;vertical-align:middle}
  .lb-meta{flex:none;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .lb-score{flex:none;min-width:40px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
  .empty{color:#7b81ad;font-size:14px;text-align:center;padding:28px 8px}

  .lb-toggle{
    margin-top:10px;
    background:rgba(255,255,255,.05);
    border:1px dashed rgba(255,255,255,.15);
    color:#9db4ff;
    font-size:13px;font-weight:600;
    padding:8px 12px;border-radius:11px;
    cursor:pointer;width:100%;
    font-family:inherit;
    transition:background .15s;
  }
  .lb-toggle:hover{background:rgba(255,255,255,.09)}
  .lb-toggle.hidden{display:none}

  .upgrade-panel .points-hint{
    text-align:center;
    font-size:12px;color:var(--muted);
    margin:-4px 0 12px;
  }
  .upgrade-panel .points-hint b{color:var(--gold);font-weight:700}

  .upgrade-item{
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.06);
    border-radius:14px;
    padding:12px;
    transition:border-color .2s,background .2s;
  }
  .upgrade-item.is-max{
    background:linear-gradient(135deg,rgba(255,204,102,.09),rgba(255,204,102,.02));
    border-color:rgba(255,204,102,.3);
  }
  .upgrade-item.can-buy{
    border-color:rgba(91,140,255,.35);
    background:linear-gradient(135deg,rgba(91,140,255,.1),rgba(91,140,255,.02));
  }

  .upgrade-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
  .upgrade-icon{
    font-size:20px;line-height:1;flex:none;
    width:36px;height:36px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.3);border-radius:10px;
  }
  .upgrade-info{flex:1;min-width:0}
  .upgrade-info h4{margin:0 0 3px;font-size:14px;font-weight:700}
  .upgrade-info p{margin:0;font-size:11.5px;color:var(--muted);line-height:1.4}
  .upgrade-effect{
    display:block;font-size:11.5px;color:#9db4ff;margin-top:4px;font-weight:600;
  }

  .upgrade-lv{
    display:flex;gap:3px;flex:none;
    margin-top:4px;
  }
  .upgrade-lv i{
    display:block;width:6px;height:6px;border-radius:50%;
    background:rgba(255,255,255,.14);
  }
  .upgrade-lv i.on{background:var(--gold);box-shadow:0 0 6px rgba(255,204,102,.55)}

  .upgrade-foot{display:flex;align-items:center;gap:8px}
  .upgrade-price{
    display:inline-flex;align-items:center;gap:4px;
    font-size:13px;font-weight:700;color:var(--gold);
    font-variant-numeric:tabular-nums;
  }
  .upgrade-price.poor{color:#ff7a7a}
  .upgrade-foot .btn{margin-left:auto;padding:8px 14px;font-size:13px}

  .footer{text-align:center;color:#5f648c;font-size:12px;margin-top:22px}

  .modal{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;padding:20px}
  .modal.hidden{display:none}
  .modal-backdrop{position:absolute;inset:0;background:rgba(4,5,15,.78);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .modal-panel{
    position:relative;z-index:1;width:100%;max-width:380px;
    background:linear-gradient(180deg,#1c1f3d,#16182f);
    border:1px solid var(--line);border-radius:20px;padding:22px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.9);
    animation:fadeUp .2s ease;
  }
  .modal-close{position:absolute;top:8px;right:8px;background:transparent;border:0;color:var(--muted);
    font-size:24px;width:34px;height:34px;cursor:pointer;border-radius:9px;line-height:1;font-family:inherit}
  .modal-close:hover{background:rgba(255,255,255,.06);color:#fff}
  .modal-close.hidden{display:none}
  .modal-title{font-size:17px;font-weight:700;margin:0 0 6px;text-align:center}
  .modal-subtitle{
    text-align:center;font-size:12.5px;color:var(--muted);
    margin:0 0 14px;line-height:1.5;
  }

  .tabs{display:flex;gap:5px;margin-bottom:16px;background:rgba(0,0,0,.28);padding:4px;border-radius:12px}
  .tab{flex:1;padding:9px;border:0;border-radius:9px;background:transparent;color:var(--muted);
    font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s,color .15s}
  .tab.active{background:linear-gradient(160deg,var(--accent),var(--accent2));color:#fff}

  #authForm label{display:block;margin-bottom:12px}
  #authForm label > span{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
  #authForm input{
    width:100%;background:rgba(0,0,0,.35);
    border:1px solid rgba(255,255,255,.12);border-radius:11px;
    padding:11px 12px;color:var(--text);font-size:15px;font-family:inherit;outline:none;
    transition:border-color .15s,box-shadow .15s;
  }
  #authForm input::placeholder{color:#5e6390}
  #authForm input:focus{border-color:#5b8cff;box-shadow:0 0 0 3px rgba(91,140,255,.18)}
  #authSubmit{width:100%;margin-top:2px}

  .auth-error{background:rgba(255,90,90,.12);border:1px solid rgba(255,90,90,.35);
    color:#ff9a9a;border-radius:10px;padding:9px 11px;font-size:13px;margin-bottom:11px;word-break:break-word}
  .auth-error.hidden{display:none}
  .auth-info{background:rgba(51,209,122,.12);border:1px solid rgba(51,209,122,.35);
    color:#7be2a8;border-radius:10px;padding:9px 11px;font-size:13px;margin-bottom:11px}
  .auth-info.hidden{display:none}
  .auth-tip{margin:12px 0 0;font-size:12px;color:#6d739e;text-align:center;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>⚡ 疯狂点击</h1>
    <p class="sub">无尽模式 · 想点多久点多久 · 每 <b>10</b> 次点击 = <b>1</b> 💎</p>
  </header>

  <div class="user-bar">
    <span id="userText">加载中…</span>
    <span class="points" id="pointsBox" title="点击点数">💎 <span id="pointsVal">0</span></span>
    <button id="userAction" class="btn ghost small" type="button">退出</button>
  </div>

  <div class="grid">
    <div class="left-col">
      <section class="panel">
        <div class="hud">
          <div class="hud-item"><span class="label">用时</span><span class="val" id="timer">00:00</span></div>
          <div class="hud-item"><span class="label">点击次数</span><span class="val" id="count">0</span></div>
          <div class="hud-item"><span class="label">每秒点击</span><span class="val" id="cps">0.0</span></div>
        </div>

        <button id="clickBtn" class="click-btn" type="button">开始挑战</button>

        <div id="autoInfo" class="auto-info hidden"></div>

        <div class="stop-row hidden" id="stopRow">
          <button id="stopBtn" class="btn danger block" type="button">结束挑战</button>
        </div>

        <div id="result" class="result hidden">
          <div class="result-score"><span id="resultScore">0</span><small>次</small></div>
          <p class="result-msg" id="resultMsg"></p>
          <p class="result-reward hidden" id="resultReward"></p>
          <div class="stack">
            <button id="saveBtn" class="btn primary block" type="button">上传成绩</button>
            <button id="againBtn" class="btn ghost block" type="button">再来一次</button>
          </div>
        </div>
      </section>

      <section class="panel upgrade-panel">
        <h2>⚡ 升级 <span class="badge" id="upgradeBadge">0 级</span></h2>
        <p class="points-hint">当前点数 <b id="pointsHint">0</b> · 每 10 次点击 = 1 💎</p>
        <div id="upgradeList"></div>
      </section>
    </div>

    <section class="panel">
      <h2>🏆 排行榜 <span class="badge" id="lbBadge">加载中…</span></h2>
      <div id="leaderboard" class="lb-wrap collapsed"></div>
      <button id="lbToggle" class="lb-toggle hidden" type="button">展开全部 ▼</button>
    </section>
  </div>

  <p class="footer">纯前端小游戏 · 托管于 GitHub Pages</p>
</div>

<div id="authModal" class="modal hidden">
  <div class="modal-backdrop" data-close></div>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" type="button" data-close aria-label="关闭">×</button>
    <h3 class="modal-title" id="modalTitle">登录</h3>
    <p class="modal-subtitle" id="modalSubtitle">必须先登录才能开始游戏</p>

    <div class="tabs">
      <button class="tab active" type="button" data-tab="login">登录</button>
      <button class="tab" type="button" data-tab="register">注册</button>
    </div>

    <div id="authError" class="auth-error hidden"></div>
    <div id="authInfo" class="auth-info hidden"></div>

    <form id="authForm" novalidate>
      <label>
        <span>用户名</span>
        <input id="authUsername" type="text" autocomplete="username"
               placeholder="3-16 位字母、数字或下划线"
               minlength="3" maxlength="16" required>
      </label>
      <label>
        <span>密码</span>
        <input id="authPassword" type="password" autocomplete="current-password"
               placeholder="至少 6 位" minlength="6" maxlength="72" required>
      </label>
      <button type="submit" class="btn primary" id="authSubmit">登录</button>
    </form>

    <p class="auth-tip">注册仅需用户名 + 密码，无需邮箱<br>用户名不支持中文和空格</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  'use strict';

  const CONFIG = {
    SHOW: 20,
    LB_PREVIEW: 3,                         // 折叠时显示前 N 名
    LB_REFRESH_MS: 10 * 60 * 1000,         // 排行榜 10 分钟刷新一次
    POINT_PER_CLICKS: 10,                  // 每 10 次点击 = 1 点数

    SUPABASE_URL: 'https://ideuctxwohmwdbdtjyuh.supabase.co',
    SUPABASE_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlkZXVjdHh3b2htd2RiZHRqeXVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0MjE4MDUsImV4cCI6MjEwNTk5NzgwNX0.YPy9y6njWnU5J3ptf1rSKImAVfnAnUR1TbljOd2D-EE',
    TABLE: 'scores',
    PROFILES: 'profiles',
    EMAIL_DOMAIN: '@clicks.game'
  };

  // 自动点击等级 → 间隔（毫秒），索引即等级
  const AUTO_INTERVALS = [0, 2000, 1200, 800, 600, 400];

  const UPGRADES = [
    {
      key: 'autoClick',
      icon: '🤖',
      name: '自动点击',
      desc: '自动帮你点击按钮，升级后价格翻倍',
      maxLevel: 5,
      baseCost: 20,
      growth: 2,
      effectText: lv => {
        if (lv === 0) return '尚未解锁';
        return '每 ' + (AUTO_INTERVALS[lv] / 1000).toFixed(1) + ' 秒自动点击一次';
      }
    }
  ];

  function upgradeCost(u, level) {
    return u.baseCost * Math.pow(u.growth, level);
  }

  let sb = null;
  try {
    if (window.supabase && window.supabase.createClient) {
      sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
    }
  } catch (e) {
    console.error('Supabase 初始化失败', e);
  }

  const $ = id => document.getElementById(id);
  const timerEl = $('timer'), countEl = $('count'), cpsEl = $('cps');
  const clickBtn = $('clickBtn');
  const autoInfo = $('autoInfo'), stopRow = $('stopRow'), stopBtn = $('stopBtn');
  const resultEl = $('result'), resultScoreEl = $('resultScore'), resultMsgEl = $('resultMsg'),
        resultRewardEl = $('resultReward');
  const saveBtn = $('saveBtn'), againBtn = $('againBtn');
  const lbEl = $('leaderboard'), lbBadge = $('lbBadge'), lbToggle = $('lbToggle');
  const userText = $('userText'), userAction = $('userAction');
  const pointsVal = $('pointsVal'), pointsHint = $('pointsHint');
  const upgradeList = $('upgradeList'), upgradeBadge = $('upgradeBadge');
  const authModal = $('authModal'), authForm = $('authForm');
  const authUsername = $('authUsername'), authPassword = $('authPassword');
  const authSubmit = $('authSubmit'), authError = $('authError'), authInfo = $('authInfo');
  const modalTitle = $('modalTitle'), modalSubtitle = $('modalSubtitle');
  const modalCloseBtn = authModal.querySelector('.modal-close');
  const tabBtns = authModal.querySelectorAll('.tab[data-tab]');

  /* ================= 状态 ================= */
  let phase = 'idle';          // idle | playing | finished
  let clicks = 0;
  let startAt = 0;
  let uiTimer = null;
  let autoClickTimer = null;
  let lastScore = 0;
  let lastEarnedPoints = 0;
  let currentUser = null;
  let currentProfile = null;
  let authMode = 'login';
  let submitting = false;
  let authForced = true;
  let lbExpanded = false;
  let lbRefreshTimer = null;
  let lbData = [];

  /* ================= 工具 ================= */
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => (
      { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]
    ));
  }

  function formatTime(ms) {
    const totalSec = Math.max(0, Math.floor(ms / 1000));
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    if (h > 0) return h + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
    return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }

  function usernameOf(u) {
    if (!u) return '';
    const meta = u.user_metadata || {};
    if (meta.username) return meta.username;
    if (u.email) return u.email.split('@')[0];
    return '玩家';
  }

  function usernameToEmail(name) {
    return name.trim().toLowerCase() + CONFIG.EMAIL_DOMAIN;
  }

  function validateUsername(name) {
    if (!/^[A-Za-z0-9_]{3,16}$/.test(name)) {
      return '用户名需为 3-16 位字母、数字或下划线';
    }
    return '';
  }

  function defaultUpgrades() {
    return { autoClick: 0 };
  }

  function totalUpgradeLevel() {
    if (!currentProfile || !currentProfile.upgrades) return 0;
    return currentProfile.upgrades.autoClick || 0;
  }

  function currentAutoLevel() {
    if (!currentProfile || !currentProfile.upgrades) return 0;
    return currentProfile.upgrades.autoClick || 0;
  }

  /* ================= Profile ================= */
  async function loadProfile() {
    if (!sb || !currentUser) return null;
    const { data, error } = await sb
      .from(CONFIG.PROFILES)
      .select('id,points,upgrades')
      .eq('id', currentUser.id)
      .maybeSingle();
    if (error) { console.warn('加载 profile 失败', error); return null; }
    return data;
  }

  async function ensureProfile() {
    if (!sb || !currentUser) return null;
    let p = await loadProfile();
    if (p) {
      // 兼容旧数据结构：upgrades 里可能有 time/target/multiplier，需要迁移
      const upg = p.upgrades || {};
      const hasOld = upg.time !== undefined || upg.target !== undefined || upg.multiplier !== undefined;
      const hasNew = upg.autoClick !== undefined;
      if (hasOld && !hasNew) {
        const cleaned = { autoClick: 0 };
        const { error } = await sb.from(CONFIG.PROFILES)
          .update({ upgrades: cleaned })
          .eq('id', currentUser.id);
        if (!error) return { ...p, upgrades: cleaned };
      } else if (!hasNew) {
        const cleaned = { ...upg, autoClick: 0 };
        const { error } = await sb.from(CONFIG.PROFILES)
          .update({ upgrades: cleaned })
          .eq('id', currentUser.id);
        if (!error) return { ...p, upgrades: cleaned };
      }
      return p;
    }
    const { error } = await sb
      .from(CONFIG.PROFILES)
      .insert({ id: currentUser.id, points: 0, upgrades: defaultUpgrades() });
    if (error) console.warn('创建 profile 失败', error);
    return await loadProfile();
  }

  function setProfile(p) {
    currentProfile = p;
    renderUserBar();
    renderUpgradeList();
    updateAutoInfo();
  }

  function renderUserBar() {
    if (!sb) {
      userText.textContent = '云端不可用 · 请检查网络后刷新';
      userAction.disabled = true;
      pointsVal.textContent = '0';
      return;
    }
    if (currentUser) {
      userText.innerHTML = '👤 <span class="uname">' + escapeHtml(usernameOf(currentUser)) + '</span>';
      userAction.disabled = false;
      userAction.textContent = '退出';
      userAction.dataset.action = 'logout';
      pointsVal.textContent = (currentProfile && currentProfile.points) || 0;
      pointsHint.textContent = (currentProfile && currentProfile.points) || 0;
    } else {
      userText.textContent = '未登录';
      userAction.disabled = true;
      pointsVal.textContent = '0';
      pointsHint.textContent = '0';
    }
  }

  /* ================= 排行榜（每用户去重）================= */
  async function fetchScores() {
    if (!sb) throw new Error('云端不可用');

    const fetchLimit = Math.max(CONFIG.SHOW * 10, 200);

    const { data, error } = await sb
      .from(CONFIG.TABLE)
      .select('id,user_id,name,score,cps,created_at')
      .order('score', { ascending: false })
      .order('created_at', { ascending: true })
      .limit(fetchLimit);

    if (error) throw error;

    // 每个 user_id 只保留最高分（已按分数降序，第一次出现就是最高分）
    const seen = new Set();
    const deduped = [];
    for (const r of (data || [])) {
      const key = r.user_id || ('anon_' + r.id);
      if (seen.has(key)) continue;
      seen.add(key);
      deduped.push(r);
      if (deduped.length >= CONFIG.SHOW) break;
    }

    return deduped.map(r => ({
      id: r.id,
      user_id: r.user_id,
      name: r.name,
      score: Number(r.score) || 0,
      cps: Number(r.cps) || 0,
      time: Date.parse(r.created_at) || 0
    }));
  }

  function renderLeaderboard(list) {
    lbData = list || [];
    const total = lbData.length;

    if (!total) {
      lbEl.innerHTML = '<div class="empty">还没有记录，快来抢占第一名！</div>';
      lbToggle.classList.add('hidden');
      return;
    }

    const medals = ['🥇','🥈','🥉'];
    const myId = currentUser ? currentUser.id : null;

    lbEl.innerHTML = lbData.map((it, i) => {
      const rank = i + 1;
      const mark = rank <= 3 ? medals[rank - 1] : rank;
      const isMe = myId && it.user_id === myId;
      const isExtra = rank > CONFIG.LB_PREVIEW;

      return '<div class="lb-row'
        + (isMe ? ' is-me' : '')
        + (isExtra ? ' extra' : '')
        + '">'
        + '<span class="lb-rank">' + mark + '</span>'
        + '<span class="lb-name">' + escapeHtml(it.name) + (isMe ? '<em>我</em>' : '') + '</span>'
        + '<span class="lb-meta">' + it.cps.toFixed(1) + '/s</span>'
        + '<span class="lb-score">' + it.score + '</span>'
        + '</div>';
    }).join('');

    // 折叠状态由 lbExpanded 控制
    lbEl.classList.toggle('collapsed', !lbExpanded);

    if (total > CONFIG.LB_PREVIEW) {
      lbToggle.classList.remove('hidden');
      lbToggle.textContent = lbExpanded
        ? '收起 ▲'
        : '展开全部（' + total + ' 名）▼';
    } else {
      lbToggle.classList.add('hidden');
    }
  }

  async function refreshLeaderboard() {
    if (!sb) {
      lbBadge.textContent = '离线';
      lbBadge.className = 'badge warn';
      renderLeaderboard([]);
      return;
    }
    try {
      const rows = await fetchScores();
      lbBadge.textContent = '云端';
      lbBadge.className = 'badge cloud';
      renderLeaderboard(rows);
    } catch (err) {
      console.warn('排行榜加载失败', err);
      lbBadge.textContent = '加载失败';
      lbBadge.className = 'badge warn';
      const hint = (err && err.message) ? escapeHtml(err.message) : '请稍后重试';
      lbEl.innerHTML = '<div class="empty">排行榜加载失败<br><span style="font-size:12px;opacity:.7">' + hint + '</span></div>';
      lbToggle.classList.add('hidden');
    }
  }

  // 每 10 分钟自动刷新（页面可见时才刷）
  function startLbAutoRefresh() {
    if (lbRefreshTimer) clearInterval(lbRefreshTimer);
    lbRefreshTimer = setInterval(() => {
      if (document.hidden) return;
      if (!currentUser) return;
      refreshLeaderboard();
    }, CONFIG.LB_REFRESH_MS);
  }

  lbToggle.addEventListener('click', function () {
    lbExpanded = !lbExpanded;
    renderLeaderboard(lbData);
  });

  /* ================= 升级面板 ================= */
  function renderUpgradeList() {
    const pts = (currentProfile && currentProfile.points) || 0;
    const lvObj = (currentProfile && currentProfile.upgrades) || defaultUpgrades();

    upgradeBadge.textContent = totalUpgradeLevel() + ' 级';

    upgradeList.innerHTML = UPGRADES.map(u => {
      const level = lvObj[u.key] || 0;
      const isMax = level >= u.maxLevel;
      const cost = isMax ? 0 : upgradeCost(u, level);
      const canBuy = !isMax && pts >= cost;
      const poor = !isMax && pts < cost;

      const dots = Array.from({ length: u.maxLevel }, (_, i) =>
        '<i class="' + (i < level ? 'on' : '') + '"></i>'
      ).join('');

      let btnHtml;
      if (isMax) {
        btnHtml = '<button class="btn ghost" disabled>已满级</button>';
      } else if (canBuy) {
        btnHtml = '<button class="btn gold" data-buy="' + u.key + '">升级</button>';
      } else {
        btnHtml = '<button class="btn ghost" disabled>点数不足</button>';
      }

      return '<div class="upgrade-item' + (isMax ? ' is-max' : (canBuy ? ' can-buy' : '')) + '">'
        + '<div class="upgrade-head">'
        +   '<div class="upgrade-icon">' + u.icon + '</div>'
        +   '<div class="upgrade-info">'
        +     '<h4>' + escapeHtml(u.name) + '</h4>'
        +     '<p>' + escapeHtml(u.desc) + '</p>'
        +     '<span class="upgrade-effect">' + escapeHtml(u.effectText(level)) + '</span>'
        +   '</div>'
        +   '<div class="upgrade-lv">' + dots + '</div>'
        + '</div>'
        + '<div class="upgrade-foot">'
        +   '<span class="upgrade-price' + (poor ? ' poor' : '') + '">'
        +     (isMax ? '—' : '💎 ' + cost)
        +   '</span>'
        +   btnHtml
        + '</div>'
        + '</div>';
    }).join('');
  }

  async function purchaseUpgrade(key) {
    if (!sb || !currentUser || !currentProfile) return;
    const u = UPGRADES.find(x => x.key === key);
    if (!u) return;

    const level = (currentProfile.upgrades && currentProfile.upgrades[key]) || 0;
    if (level >= u.maxLevel) return;
    const cost = upgradeCost(u, level);
    if (currentProfile.points < cost) return;

    const btn = upgradeList.querySelector('[data-buy="' + key + '"]');
    if (btn) { btn.disabled = true; btn.textContent = '购买中…'; }

    const { data, error } = await sb.rpc('purchase_upgrade', {
      p_key: key,
      p_cost: cost,
      p_max: u.maxLevel
    });

    if (error) {
      console.warn('购买失败', error);
      renderUpgradeList();
      alert('购买失败：' + (error.message || '请稍后重试'));
      return;
    }

    const res = data || {};
    if (!res.ok) {
      renderUpgradeList();
      const msgs = {
        insufficient: '点数不足',
        max_level: '已经满级啦',
        not_authenticated: '登录状态已失效',
        profile_not_found: '数据异常，请重新登录',
        invalid_key: '升级项不存在',
        invalid_param: '参数错误'
      };
      alert(msgs[res.error] || ('购买失败：' + res.error));
      return;
    }

    const newUpg = Object.assign({}, currentProfile.upgrades || defaultUpgrades());
    newUpg[key] = res.level;

    setProfile({
      id: currentProfile.id,
      points: res.points,
      upgrades: newUpg
    });

    // 游戏中购买 → 立刻生效
    if (phase === 'playing') startAutoClick();
  }

  upgradeList.addEventListener('click', function (e) {
    const btn = e.target.closest('[data-buy]');
    if (!btn) return;
    purchaseUpgrade(btn.dataset.buy);
  });

  /* ================= 游戏逻辑 ================= */
  function updateHud() {
    if (phase !== 'playing') return;
    const elapsed = Date.now() - startAt;
    timerEl.textContent = formatTime(elapsed);
    cpsEl.textContent = (clicks / Math.max(elapsed / 1000, 0.5)).toFixed(1);
  }

  function resetHud() {
    timerEl.textContent = '00:00';
    countEl.textContent = '0';
    cpsEl.textContent = '0.0';
  }

  function updateAutoInfo() {
    const lv = currentAutoLevel();
    if (phase === 'playing' && lv > 0) {
      autoInfo.textContent = '🤖 自动点击中 · 每 ' + (AUTO_INTERVALS[lv] / 1000).toFixed(1) + ' 秒一次';
      autoInfo.classList.remove('hidden');
    } else {
      autoInfo.classList.add('hidden');
    }
  }

  function startAutoClick() {
    stopAutoClick();
    const lv = currentAutoLevel();
    if (lv <= 0) { updateAutoInfo(); return; }
    const interval = AUTO_INTERVALS[lv];
    autoClickTimer = setInterval(() => {
      if (phase !== 'playing') return;
      clicks++;
      countEl.textContent = clicks;
    }, interval);
    updateAutoInfo();
  }

  function stopAutoClick() {
    if (autoClickTimer) { clearInterval(autoClickTimer); autoClickTimer = null; }
  }

  function startGame() {
    if (!currentUser) { openAuthModal('login', true); return; }
    if (!sb) return;
    if (!currentProfile) { alert('正在加载你的数据，请稍候…'); return; }

    clicks = 0;
    startAt = Date.now();
    lastEarnedPoints = 0;

    resultEl.classList.add('hidden');
    resetHud();

    clickBtn.disabled = false;
    clickBtn.textContent = '点！';
    clickBtn.classList.add('is-playing');

    stopRow.classList.remove('hidden');

    phase = 'playing';
    updateHud();
    updateAutoInfo();

    if (uiTimer) clearInterval(uiTimer);
    uiTimer = setInterval(updateHud, 100);

    startAutoClick();
  }

  function endGame() {
    if (phase !== 'playing') return;
    phase = 'finished';

    stopAutoClick();
    if (uiTimer) { clearInterval(uiTimer); uiTimer = null; }
    updateAutoInfo();

    clickBtn.disabled = false;
    clickBtn.classList.remove('is-playing');
    clickBtn.textContent = '再来一局';

    stopRow.classList.add('hidden');

    lastScore = clicks;
    const elapsed = Date.now() - startAt;
    const cps = clicks / Math.max(elapsed / 1000, 0.5);
    lastEarnedPoints = Math.floor(lastScore / CONFIG.POINT_PER_CLICKS);

    resultScoreEl.textContent = lastScore;
    resultMsgEl.textContent = '用时 ' + formatTime(elapsed) + ' · 平均 ' + cps.toFixed(1) + ' 次/秒';

    if (lastEarnedPoints > 0) {
      resultRewardEl.textContent = '💎 上传可获得 ' + lastEarnedPoints + ' 点数';
      resultRewardEl.classList.remove('hidden');
      saveBtn.textContent = '上传成绩 · 获得 ' + lastEarnedPoints + ' 💎';
    } else {
      resultRewardEl.textContent = '💎 点击满 ' + CONFIG.POINT_PER_CLICKS + ' 次才能获得点数';
      resultRewardEl.classList.remove('hidden');
      saveBtn.textContent = '上传成绩（无点数）';
    }

    resultEl.classList.remove('hidden');
    saveBtn.disabled = false;
  }

  // 手动点击
  function registerClick() {
    if (phase !== 'playing') return;
    clicks++;
    countEl.textContent = clicks;
    if (navigator.vibrate) { try { navigator.vibrate(6); } catch (e) {} }
  }

  /* ================= 上传成绩 ================= */
  async function handleSave() {
    if (!currentUser) { openAuthModal('login', true); return; }
    if (!sb) return;
    if (phase !== 'finished') return;

    saveBtn.disabled = true;
    saveBtn.textContent = '上传中…';

    const elapsed = Date.now() - startAt;
    const cps = Number((lastScore / Math.max(elapsed / 1000, 0.5)).toFixed(2));

    const { data, error } = await sb.rpc('submit_score', {
      p_name: usernameOf(currentUser),
      p_score: lastScore,
      p_cps: cps,
      p_points: lastEarnedPoints
    });

    if (error) {
      console.warn('上传失败', error);
      saveBtn.disabled = false;
      saveBtn.textContent = '上传失败，点此重试';
      return;
    }

    const res = data || {};
    if (!res.ok) {
      saveBtn.disabled = false;
      saveBtn.textContent = '上传失败，点此重试';
      return;
    }

    if (typeof res.points === 'number') {
      setProfile({
        id: currentProfile.id,
        points: res.points,
        upgrades: currentProfile.upgrades
      });
    }

    saveBtn.textContent = '已上传 ✓ +' + lastEarnedPoints + ' 💎';

    // 上传后立即刷新一次（10 分钟自动刷新照旧）
    await refreshLeaderboard();
  }

  /* ================= 弹窗 ================= */
  function openAuthModal(mode, forced) {
    if (!sb) return;
    authForced = !!forced;
    setAuthMode(mode || 'login');
    authModal.classList.remove('hidden');
    hideAuthMessages();
    authUsername.value = '';
    authPassword.value = '';
    setTimeout(() => authUsername.focus(), 40);
  }

  function closeAuthModal() {
    if (authForced && !currentUser) return;
    authModal.classList.add('hidden');
    hideAuthMessages();
  }

  function setAuthMode(mode) {
    authMode = mode;
    tabBtns.forEach(btn => btn.classList.toggle('active', btn.dataset.tab === mode));
    modalTitle.textContent = mode === 'register' ? '注册新账号' : '登录';
    modalSubtitle.textContent = authForced ? '必须先登录才能开始游戏' : '登录后可上传成绩、升级';
    authSubmit.textContent = mode === 'register' ? '注册并登录' : '登录';
    authPassword.setAttribute('autocomplete', mode === 'register' ? 'new-password' : 'current-password');
    modalCloseBtn.classList.toggle('hidden', authForced);
    hideAuthMessages();
  }

  function showAuthError(msg) {
    authError.textContent = msg;
    authError.classList.remove('hidden');
    authInfo.classList.add('hidden');
  }
  function showAuthInfo(msg) {
    authInfo.textContent = msg;
    authInfo.classList.remove('hidden');
    authError.classList.add('hidden');
  }
  function hideAuthMessages() {
    authError.classList.add('hidden');
    authInfo.classList.add('hidden');
  }

  async function submitAuth(e) {
    e.preventDefault();
    if (submitting || !sb) return;
    hideAuthMessages();

    const username = authUsername.value.trim();
    const password = authPassword.value;

    const nameErr = validateUsername(username);
    if (nameErr) { showAuthError(nameErr); authUsername.focus(); return; }
    if (password.length < 6) { showAuthError('密码至少 6 位'); authPassword.focus(); return; }

    submitting = true;
    authSubmit.disabled = true;
    authSubmit.textContent = authMode === 'register' ? '注册中…' : '登录中…';

    try {
      if (authMode === 'register') {
        const { data, error } = await sb.auth.signUp({
          email: usernameToEmail(username),
          password,
          options: { data: { username } }
        });
        if (error) throw error;

        if (!data.session) {
          showAuthInfo('注册成功，但当前项目开启了邮箱确认。请到 Supabase 后台关闭「Confirm email」。');
          submitting = false;
          authSubmit.disabled = false;
          authSubmit.textContent = '注册并登录';
          return;
        }
      } else {
        const { error } = await sb.auth.signInWithPassword({
          email: usernameToEmail(username),
          password
        });
        if (error) throw error;
      }
    } catch (err) {
      console.warn(err);
      showAuthError(translateAuthError(err));
      submitting = false;
      authSubmit.disabled = false;
      authSubmit.textContent = authMode === 'register' ? '注册并登录' : '登录';
    }
  }

  function translateAuthError(err) {
    const msg = (err && (err.message || err.error_description || err.msg)) || '操作失败';
    if (/already registered|already exists|User already/i.test(msg)) return '该用户名已被注册，换一个试试';
    if (/Invalid login credentials/i.test(msg)) return '用户名或密码错误';
    if (/Password should be at least/i.test(msg)) return '密码太短，至少 6 位';
    if (/Email not confirmed/i.test(msg)) return '邮箱未确认。请到 Supabase 后台关闭「Confirm Email」。';
    if (/Email signups are disabled|email_provider_disabled/i.test(msg)) return '当前项目已禁用邮箱注册，请到 Supabase → Authentication → Providers 打开 Email。';
    if (/signup.*disabled|signups.*disabled/i.test(msg)) return '当前项目已禁用注册。请到 Supabase → Authentication → Sign In / Providers 打开「Allow new users to sign up」。';
    if (/rate limit|too many/i.test(msg)) return '操作太频繁，请稍后再试';
    return msg;
  }

  async function handleLogout() {
    if (!sb) return;
    await sb.auth.signOut();
  }

  /* ================= 事件绑定 ================= */
  clickBtn.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;

    if (!currentUser) { openAuthModal('login', true); return; }

    if (phase === 'playing') registerClick();
    else startGame();
  });

  stopBtn.addEventListener('click', endGame);
  againBtn.addEventListener('click', startGame);
  saveBtn.addEventListener('click', handleSave);

  userAction.addEventListener('click', function () {
    if (userAction.dataset.action === 'logout') handleLogout();
  });

  authForm.addEventListener('submit', submitAuth);

  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => setAuthMode(btn.dataset.tab));
  });

  authModal.addEventListener('click', function (e) {
    if (!e.target.closest('[data-close]')) return;
    if (authForced && !currentUser) return;
    closeAuthModal();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (!authModal.classList.contains('hidden')) {
        if (authForced && !currentUser) return;
        closeAuthModal();
        return;
      }
    }

    // 空格：游戏中 = 点击；非游戏中 = 开始
    if (e.code === 'Space' || e.code === 'Enter') {
      if (e.repeat) return;
      if (!authModal.classList.contains('hidden')) return;
      if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
      if (!currentUser) return;

      e.preventDefault();
      if (phase === 'playing') registerClick();
      else startGame();
    }
  });

  /* ================= 认证状态 ================= */
  async function onSignedIn(session) {
    currentUser = session.user;
    renderUserBar();

    let p = await ensureProfile();
    if (!p) {
      p = { id: currentUser.id, points: 0, upgrades: defaultUpgrades() };
    }
    setProfile(p);

    closeAuthModal();
    refreshLeaderboard();
    renderUpgradeList();
    updateAutoInfo();
  }

  function onSignedOut() {
    // 停止所有计时器
    stopAutoClick();
    if (uiTimer) { clearInterval(uiTimer); uiTimer = null; }
    if (lbRefreshTimer) { clearInterval(lbRefreshTimer); lbRefreshTimer = null; }

    phase = 'idle';
    currentUser = null;
    currentProfile = null;
    resetHud();

    clickBtn.disabled = false;
    clickBtn.classList.remove('is-playing');
    clickBtn.textContent = '开始挑战';
    stopRow.classList.add('hidden');
    resultEl.classList.add('hidden');
    autoInfo.classList.add('hidden');

    renderUserBar();
    renderUpgradeList();
    refreshLeaderboard();
    openAuthModal('login', true);
  }

  /* ================= 初始化 ================= */
  async function init() {
    resetHud();
    renderUserBar();
    renderUpgradeList();

    if (!sb) {
      userText.textContent = '云端不可用 · 请检查网络后刷新';
      lbBadge.textContent = '离线';
      lbBadge.className = 'badge warn';
      lbEl.innerHTML = '<div class="empty">无法连接云端</div>';
      return;
    }

    sb.auth.onAuthStateChange(function (event, session) {
      if (event === 'SIGNED_IN' || event === 'INITIAL_SESSION' || event === 'TOKEN_REFRESHED') {
        if (session) onSignedIn(session);
      }
      if (event === 'SIGNED_OUT') {
        onSignedOut();
      }
      submitting = false;
      authSubmit.disabled = false;
    });

    try {
      const { data } = await sb.auth.getSession();
      if (data && data.session) {
        await onSignedIn(data.session);
      } else {
        openAuthModal('login', true);
        refreshLeaderboard();
      }
    } catch (e) {
      console.warn(e);
      openAuthModal('login', true);
      refreshLeaderboard();
    }

    // 页面切回前台时，如果 10 分钟已过，立即刷新一次
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && currentUser) {
        refreshLeaderboard();
      }
    });

    startLbAutoRefresh();
  }

  init();
})();
</script>
</body>
</html>
